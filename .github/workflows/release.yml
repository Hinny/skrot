name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump is pushed back to main at the end, which needs
          # more than the tagged commit.
          fetch-depth: 0

      - name: Read version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Apply the version to app/build.gradle.kts
        run: .github/scripts/set-version.sh "${{ steps.version.outputs.name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.SKROT_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/skrot.jks"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        env:
          SKROT_KEYSTORE_FILE: ${{ runner.temp }}/skrot.jks
          SKROT_KEYSTORE_PASSWORD: ${{ secrets.SKROT_KEYSTORE_PASSWORD }}
          SKROT_KEY_ALIAS: ${{ secrets.SKROT_KEY_ALIAS }}
          SKROT_KEY_PASSWORD: ${{ secrets.SKROT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "skrot-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: skrot-*.apk
          generate_release_notes: true

      # The APK is already built and published from the tag; this only keeps the
      # checked-in version from drifting behind the releases, which is what used
      # to happen when the bump was a separate manual commit.
      #
      # It goes through a pull request because main only accepts those (the
      # "Main protect" ruleset) -- pushing to main directly is what made every
      # release run end red while the release itself was fine. The bot's token
      # cannot trigger CI on the PR, and main requires no status checks, so it
      # is mergeable as soon as it opens; squash-merge it before the next tag
      # or the next versionCode is computed from a stale file.
      - name: Open a pull request with the version bump
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          .github/scripts/set-version.sh "$VERSION_NAME"
          if git diff --quiet -- app/build.gradle.kts; then
            echo "main already carries $VERSION_NAME; nothing to open"
            exit 0
          fi
          branch="release/bump-$VERSION_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git commit -m "Bump version to $VERSION_NAME" -- app/build.gradle.kts
          # Re-running a release rewrites the same branch rather than failing on it.
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a pull request for $branch is already open"
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Bump version to $VERSION_NAME" \
            --body "Version bump for the $GITHUB_REF_NAME release, opened by the release workflow. Squash-merge it before tagging the next release so versionCode keeps counting from the right place."
